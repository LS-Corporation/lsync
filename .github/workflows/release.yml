name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Testes
        env:
          PYTHONIOENCODING: utf-8
        run: python tests/smoke_test.py

      - name: Gerar executável
        run: pyinstaller packaging/lsync.spec --noconfirm --distpath dist --workpath build

      - name: Gerar instalador e versão portátil
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          if ($v -notmatch '^\d') { $v = "0.0.0" }
          $env:LSYNC_VERSION = $v
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc packaging/installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Compress-Archive -Path dist/Lsync -DestinationPath dist/Lsync-Portatil.zip

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Lsync-Setup.exe
            dist/Lsync-Portatil.zip
          body_path: packaging/release-notes.md

      - name: Guardar arquivos (execução manual)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: Lsync-windows
          path: |
            dist/Lsync-Setup.exe
            dist/Lsync-Portatil.zip
